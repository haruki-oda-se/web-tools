<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>リンク帳 | 工場管理</title>
<style>
  :root {
    --ink: #1c1a17;
    --paper: #faf7f2;
    --line: #e2dcd2;
    --amazon: #e88b00;
    --done: #3a7d44;
    --accent: #24548f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  header {
    padding: 18px 16px 12px; border-bottom: 2px solid var(--ink);
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 19px; letter-spacing: .02em; }
  header .count { font-size: 13px; color: #6b645a; }
  main { max-width: 640px; margin: 0 auto; padding: 14px 14px 80px; }
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .card.pending { border-left: 4px solid var(--amazon); }
  .card.done { border-left: 4px solid var(--done); }
  .pname { font-weight: 600; margin: 0 0 8px; word-break: break-all; }
  .row { display: flex; gap: 8px; }
  input[type="url"], input[type="password"] {
    flex: 1; min-width: 0; padding: 9px 10px; font-size: 14px;
    border: 1px solid var(--line); border-radius: 7px; background: var(--paper);
  }
  input[type="url"]:focus { outline: 2px solid var(--accent); background: #fff; }
  a.amz, button {
    padding: 9px 12px; border-radius: 7px; font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; text-decoration: none; white-space: nowrap;
  }
  a.amz { background: var(--amazon); color: #fff; display: inline-flex; align-items: center; }
  button.primary { background: var(--ink); color: #fff; }
  button.ghost { background: transparent; border: 1px solid var(--line); color: #6b645a; }
  .savebar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid var(--line); padding: 10px 14px;
    display: flex; gap: 10px; justify-content: center;
  }
  .savebar button.primary { flex: 1; max-width: 400px; padding: 13px; font-size: 15px; }
  .status { text-align: center; font-size: 13px; color: #6b645a; padding: 8px; }
  .status.err { color: #b3261e; }
  details { margin-top: 20px; }
  summary { cursor: pointer; font-weight: 600; color: #6b645a; }
  .done .row a.amz { background: var(--done); }
  #setup { padding: 20px 16px; max-width: 480px; margin: 0 auto; }
  #setup ol { padding-left: 20px; }
  .empty { text-align: center; padding: 40px 0; color: #6b645a; }
  .tabs { display:flex; gap:8px; padding: 0 16px 14px; border-bottom: 1px solid var(--line); }
  .tab { padding:8px 16px; border-radius:7px; font-size:14px; font-weight:600; border:1px solid var(--line);
         background:transparent; cursor:pointer; color:var(--ink); }
  .tab.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  .section { display:none; }
  .section.active { display:block; }
  .acard { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .acard.waiting { border-left:4px solid var(--accent); }
  .acard.done { border-left:4px solid var(--done); }
  .ameta { font-size:12px; color:#6b645a; margin:2px 0 8px; }
  .aurl { display:flex; gap:8px; margin-top:6px; }
  .aurl input { flex:1; min-width:0; padding:8px 10px; font-size:14px;
    border:1px solid var(--line); border-radius:7px; background:var(--paper); }
  button.save-url { padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600;
    border:none; cursor:pointer; background:var(--accent); color:#fff; white-space:nowrap; }
  .asaved { font-size:12px; color:var(--done); margin-top:4px; }
</style>
</head>
<body>
<header>
  <h1>📋 工場管理アプリ</h1>
  <span class="count" id="count"></span>
</header>
<div class="tabs">
  <button class="tab active" onclick="switchTab('link')">🛒 リンク帳</button>
  <button class="tab" onclick="switchTab('single')">📝 単品記事</button>
  <button class="tab" onclick="switchTab('article')">📄 記事管理</button>
  <button class="tab" onclick="switchTab('improve')">🔧 記事改善</button>
</div>

<div id="setup" hidden>
  <p><strong>初回設定:</strong> GitHubのアクセストークンを保存します(この端末のブラウザ内にのみ保存されます)。</p>
  <ol>
    <li>GitHub → Settings → Developer settings → Fine-grained tokens → Generate new token</li>
    <li>Repository access: <b>Only select repositories → app-factory</b></li>
    <li>Permissions: <b>Contents → Read and write</b></li>
  </ol>
  <div class="row">
    <input type="password" id="token" placeholder="github_pat_...">
    <button class="primary" onclick="saveToken()">保存</button>
  </div>
  <p class="status err" id="setupErr"></p>
</div>

<main>
<div id="linkSection" class="section active">
  <div id="pendingList"></div>
  <details id="doneWrap"><summary id="doneSummary"></summary><div id="doneList"></div></details>
</main>

<div class="savebar" id="savebar" hidden>
  <button class="primary" onclick="save()">入力した分を保存</button>
  <button class="ghost" onclick="load()">再読込</button>
</div>
  <details id="hiddenLinksWrap" style="margin:16px 14px 0;" hidden><summary id="hiddenLinksSummary" style="cursor:pointer;font-weight:600;color:#6b645a;"></summary><div id="hiddenLinksList"></div></details>
</div><!-- /linkSection -->

<div id="singleSection" class="section">
  <div id="singleWrap" style="padding:0 0 80px;max-width:640px;margin:0 auto;"></div>
</div>

<div id="improveSection" class="section">
  <div id="improveWrap" style="padding:0 0 80px;max-width:640px;margin:0 auto;"></div>
</div>

<div id="articleSection" class="section">
  <div id="waitingList" style="padding:0 0 80px;max-width:640px;margin:0 auto;"></div>
  <div class="savebar" id="articleReload" hidden>
    <button class="ghost" onclick="loadTracker()">再読込</button>
  </div>
</div>
<p class="status" id="status"></p>

<script>
const OWNER = "haruki-oda-se";
const REPO = "app-factory";
const PATH = "amazon_links.txt";
const API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;
let sha = null;
let entries = [];   // {key, url}

const $ = id => document.getElementById(id);
const token = () => localStorage.getItem("gh_token") || "";

function saveToken() {
  const t = $("token").value.trim();
  if (!t) { $("setupErr").textContent = "トークンを入力してください"; return; }
  localStorage.setItem("gh_token", t);
  init();
}

const TRACKER_PATH = "article_tracker.txt";
const TRACKER_API = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${TRACKER_PATH}`;
let trackerSha = null;
let articles = [];
let currentTab = "link";

function switchTab(tab) {
  currentTab = tab;
  const labels = { link: "リンク帳", single: "単品記事", article: "記事管理", improve: "記事改善" };
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("active", b.textContent.includes(labels[tab])));
  document.getElementById("linkSection").classList.toggle("active", tab === "link");
  document.getElementById("singleSection").classList.toggle("active", tab === "single");
  document.getElementById("articleSection").classList.toggle("active", tab === "article");
  document.getElementById("improveSection").classList.toggle("active", tab === "improve");
  if (tab === "article") loadTracker();
  if (tab === "single") render();
  if (tab === "improve") loadImprove();
}

async function loadTracker() {
  const list = document.getElementById("waitingList");
  list.innerHTML = '<p class="status">読み込み中…</p>';
  try {
    const res = await fetch(TRACKER_API + "?t=" + Date.now(), {
      headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" }, cache: "no-store"
    });
    if (!res.ok) { list.innerHTML = '<p class="status err">読み込みエラー (HTTP ' + res.status + ')</p>'; return; }
    const data = await res.json();
    trackerSha = data.sha;
    articles = b64decode(data.content).split("\n").filter(l => l.trim() && !l.startsWith("#"))
      .map(l => { const p = l.split("|").map(x => x.trim()); return { title:p[0]||"", url:p[1]||"", theme:p[2]||"", date:p[3]||"", type:p[4]||"", hidden:(p[5]||"").toUpperCase()==="HIDDEN" }; })
      .filter(a => a.title).reverse();
    renderArticles();
    document.getElementById("articleReload").hidden = false;
  } catch(e) { list.innerHTML = '<p class="status err">読み込みに失敗: ' + e.message + '</p>'; }
}

function renderArticles() {
  const waiting = articles.filter(a => !a.url && !a.hidden);
  const done = articles.filter(a => a.url && !a.hidden);
  const hiddenA = articles.filter(a => a.hidden);
  const list = document.getElementById("waitingList");
  let html = "";
  if (waiting.length === 0) {
    html += '<div class="empty">URL待ちの記事はありません 🎉<br>工場が記事を生成すると自動で追加されます</div>';
  } else {
    html += `<p style="font-size:13px;color:#6b645a;padding:8px 0;">公開URL待ち <b>${waiting.length}</b> 件</p>`;
    waiting.forEach(a => {
      html += `<div class="acard waiting">
        <p class="pname">${esc(a.title)} <button class="ghost" style="font-size:11px;padding:3px 8px;" data-hidetitle="${esc(a.title)}" onclick="hideArticle(this,true)">🙈</button></p>
        <p class="ameta">${esc(a.type)} | ${esc(a.theme)} | ${esc(a.date)}</p>
        <div class="aurl">
          <input type="url" placeholder="記事を公開後にURLを貼り付け" data-title="${esc(a.title)}" inputmode="url">
          <button class="save-url" onclick="saveUrl(this)">保存</button>
        </div>
      </div>`;
    });
  }
  if (done.length > 0) {
    html += `<details style="margin-top:16px;"><summary style="cursor:pointer;font-weight:600;color:#6b645a;">公開済み ${done.length} 件</summary>`;
    done.forEach(a => {
      html += `<div class="acard done" style="margin-top:8px;">
        <p class="pname">${esc(a.title)}</p>
        <p class="ameta">${esc(a.type)} | ${esc(a.theme)} | ${esc(a.date)}</p>
        <p class="asaved"><a href="${esc(a.url)}" target="_blank">${esc(a.url)}</a></p>
      </div>`;
    });
    html += `</details>`;
  }
  if (hiddenA.length > 0) {
    html += `<details style="margin-top:16px;"><summary style="cursor:pointer;font-weight:600;color:#6b645a;">非表示 ${hiddenA.length} 件</summary>`;
    hiddenA.forEach(a => {
      html += `<div class="acard" style="margin-top:8px;opacity:0.6;">
        <p class="pname">${esc(a.title)}</p>
        <p class="ameta">${esc(a.type)} | ${esc(a.date)}</p>
        <button class="ghost" style="font-size:12px;padding:4px 10px;margin-top:4px;" data-hidetitle="${esc(a.title)}" onclick="hideArticle(this,false)">表示に戻す</button>
      </div>`;
    });
    html += `</details>`;
  }
  list.innerHTML = html;
}

async function saveUrl(btn) {
  const inp = btn.previousElementSibling;
  const url = inp.value.trim();
  if (!url || !url.startsWith("http")) { inp.style.border="1px solid #b3261e"; return; }
  inp.style.border="";
  const af = articles.find(x => x.title === inp.dataset.title);
  if (!af) return;
  af.url = url;
  btn.textContent = "保存中…"; btn.disabled = true;
  const text = "# タイトル | URL | テーマ | 生成日 | 種別 | 非表示\n"
    + [...articles].reverse().map(a => `${a.title} | ${a.url} | ${a.theme} | ${a.date} | ${a.type} | ${a.hidden ? "HIDDEN" : ""}`).join("\n") + "\n";
  try {
    const res = await fetch(TRACKER_API, {
      method: "PUT",
      headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" },
      body: JSON.stringify({ message: "update: article url (" + articles[idx].title.slice(0,30) + ")", content: b64encode(text), sha: trackerSha })
    });
    if (res.ok) {
      const d = await res.json(); trackerSha = d.content.sha;
      btn.textContent = "✅ 保存"; setTimeout(() => renderArticles(), 500);
    } else {
      btn.textContent = "❌ 失敗"; btn.disabled = false;
    }
  } catch(e) { btn.textContent = "❌ エラー"; btn.disabled = false; }
}

function b64decode(s) { return decodeURIComponent(escape(atob(s.replace(/\n/g, "")))); }
function b64encode(s) { return btoa(unescape(encodeURIComponent(s))); }

let warns = {};   // key40 -> message

async function loadWarns() {
  warns = {};
  try {
    const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/amazon_links_warnings.txt?t=` + Date.now(), {
      headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" }, cache: "no-store"
    });
    if (!res.ok) return;
    const data = await res.json();
    b64decode(data.content).split("\n").forEach(l => {
      const p = l.split("|").map(x => x.trim());
      if (p.length >= 3 && p[1]) warns[p[1]] = p[2] + " (" + p[0] + ")";
    });
  } catch (e) {}
}

async function load() {
  $("status").textContent = "読み込み中…";
  $("status").className = "status";
  await loadWarns();
  await loadOutlines();
  const res = await fetch(API + "?t=" + Date.now(), {
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" },
    cache: "no-store"
  });
  if (res.status === 401 || res.status === 403) {
    localStorage.removeItem("gh_token"); init();
    $("setupErr").textContent = "トークンが無効です。作り直して再入力してください。";
    return;
  }
  if (res.status === 404) {
    $("status").textContent = "amazon_links.txt がまだリポジトリにありません(工場の初回実行後に作られます)";
    $("status").className = "status err";
    return;
  }
  const data = await res.json();
  sha = data.sha;
  entries = b64decode(data.content).split("\n")
    .map(l => l.trim()).filter(l => l && !l.startsWith("#"))
    .map(l => {
      const p = l.split("|");
      const st = (p[3] || "").trim().toUpperCase();
      return { key: (p[0] || "").trim(), url: (p[1] || "").trim(), term: (p[2] || "").trim(), status: st, hidden: st === "HIDDEN",
               img: (p[4] || "").trim(), info: (p.slice(5).join("|") || "").trim() };
    })
    .filter(e => e.key);
  render();
  $("status").textContent = "";
}

function render() {
  const pending = entries.filter(e => !e.url && !e.hidden && e.status !== "DONE");
  const done = entries.filter(e => e.url && !e.hidden && e.status !== "SINGLE" && e.status !== "SINGLE_READY" && e.status !== "DONE");
  const singleQ = entries.filter(e => e.status === "SINGLE" || e.status === "SINGLE_READY");
  const singleDone = entries.filter(e => e.status === "DONE");
  const hiddenE = entries.filter(e => e.hidden);
  $("count").textContent = `入力待ち ${pending.length} / 登録済み ${done.length}`;
  $("pendingList").innerHTML = pending.length ? pending.map(e => card(e, false)).join("")
    : `<div class="empty">入力待ちはありません 🎉<br>次の選定(毎朝4:00)をお待ちください</div>`;
  $("doneSummary").textContent = `登録済み ${done.length} 件を表示`;
  $("doneList").innerHTML = done.map(e => card(e, true)).join("");
  $("savebar").hidden = pending.length === 0;
  const hw = $("hiddenLinksWrap");
  hw.hidden = hiddenE.length === 0;
  $("hiddenLinksSummary").textContent = `非表示 ${hiddenE.length} 件`;
  $("hiddenLinksList").innerHTML = hiddenE.map(e => `
    <div class="card" style="margin-top:8px;opacity:0.6;">
      <p class="pname">${esc(e.key)}</p>
      <button class="ghost" style="font-size:12px;padding:4px 10px;margin-top:4px;" data-hidekey="${esc(e.key)}" onclick="hideLink(this,false)">表示に戻す</button>
    </div>`).join("");

  // 単品記事セクション
  const sw = $("singleWrap");
  if (sw) {
    // リンク登録済み(URLあり・NONEでない)かつ未選択・未生成の商品を選択候補に
    const selectable = entries.filter(e => {
      const u = (e.url || "").toUpperCase();
      return e.url && u !== "NONE" && e.status !== "SINGLE" && e.status !== "SINGLE_READY" && e.status !== "DONE" && !e.hidden;
    });
    let html = "";
    if (singleDirty) {
      html += `<div style="background:#fff7e6;border:1px solid #e8c98a;border-radius:8px;padding:10px 12px;margin-bottom:12px;display:flex;align-items:center;gap:10px;">
        <span style="font-size:13px;color:#7a5a1e;flex:1;">未保存の変更があります</span>
        <button id="singleSaveBtn" class="save-url" onclick="saveSingleChanges()">入力した分を保存</button>
      </div>`;
    }
    if (singleQ.length > 0) {
      html += `<p style="font-size:13px;color:#6b645a;padding:8px 0;">✅ 記事化する商品 <b>${singleQ.length}</b> 件</p>`;
      html += singleQ.map(e => prodCard(e, "selected")).join("");
      html += `<hr style="margin:20px 0;border:none;border-top:1px solid var(--line);">`;
    }
    html += `<p style="font-size:13px;color:#6b645a;padding:8px 0;">リンク登録済みの商品 <b>${selectable.length}</b> 件 — 記事化するものを選んでください</p>`;
    html += selectable.length ? selectable.map(e => prodCard(e, "candidate")).join("")
      : `<div class="empty" style="padding:20px 0;">選択できる商品がありません<br>先に「🛒 リンク帳」でURLを登録してください</div>`;
    if (singleDone.length > 0) {
      html += `<details style="margin-top:20px;"><summary style="cursor:pointer;font-weight:600;color:#6b645a;">生成済み ${singleDone.length} 件</summary>`;
      html += singleDone.map(e => prodCard(e, "done")).join("");
      html += `</details>`;
    }
    const hiddenList = entries.filter(e => e.hidden);
    if (hiddenList.length > 0) {
      html += `<details style="margin-top:16px;"><summary style="cursor:pointer;font-weight:600;color:#6b645a;">非表示 ${hiddenList.length} 件</summary>`;
      html += hiddenList.map(e => `<div class="card" style="margin-top:8px;opacity:0.6;">
        <p class="pname" style="font-size:13px;">${esc(e.key)}</p>
        <button class="ghost" style="font-size:12px;padding:4px 10px;" data-skey="${esc(e.key)}" onclick="setSingle(this,'')">表示に戻す</button>
      </div>`).join("");
      html += `</details>`;
    }
    sw.innerHTML = html;
  }
}

function histBadge(key) {
  const h = history[key.slice(0, 50)] || history[key];
  if (!h || h.count === 0) return "";
  const warn = h.count >= 2;
  return `<p style="margin:0 0 6px;">
    <span style="font-size:11px;padding:2px 8px;border-radius:6px;background:${warn ? "#f6e4e4" : "var(--paper)"};color:${warn ? "#b3261e" : "#6b645a"};border:1px solid ${warn ? "#e6bcbc" : "var(--line)"};">
      ${warn ? "⚠️ " : ""}生成${h.count}回${h.last ? " / 最終 " + esc(h.last) : ""}
    </span></p>`;
}

function prodCard(e, mode) {
  const firstImg = (e.img || "").split(",")[0].trim();
  const imgTag = firstImg
    ? `<img src="${esc(firstImg)}" alt="" style="width:80px;height:80px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex-shrink:0;">`
    : `<div style="width:80px;height:80px;border:1px solid var(--line);border-radius:8px;background:var(--paper);flex-shrink:0;"></div>`;
  let btn = "";
  if (mode === "candidate") {
    btn = `<button class="save-url" data-skey="${esc(e.key)}" onclick="setSingle(this,'SINGLE')">📝 記事化する</button>
      <button class="ghost" style="font-size:12px;padding:6px 12px;margin-left:6px;" data-skey="${esc(e.key)}" onclick="setSingle(this,'HIDDEN')">🙈 非表示</button>`;
  } else if (mode === "selected") {
    btn = `<button class="ghost" style="font-size:12px;padding:6px 12px;" data-skey="${esc(e.key)}" onclick="setSingle(this,'')">選択を外す</button>`;
  } else {
    btn = `<button class="ghost" style="font-size:12px;padding:6px 12px;" data-skey="${esc(e.key)}" onclick="setSingle(this,'SINGLE')">再度候補にする</button>`;
  }
  const border = mode === "selected" ? "border-left:4px solid var(--done);" : (mode === "done" ? "opacity:0.55;" : "");
  let outlineHtml = "";
  if (mode === "selected") {
    const ol = outlines[e.key.slice(0,50)] || outlines[e.key] || [];
    const imgs = (e.img || "").split(",").filter(x => x);
    if (ol.length === 0) {
      outlineHtml = `<p style="font-size:12px;color:#6b645a;margin:8px 0 0;">⏳ 構成の生成待ち(翌朝5:00に作成されます)</p>`;
    } else if (imgs.length < 2) {
      outlineHtml = `<p style="font-size:12px;color:#6b645a;margin:8px 0 0;">画像が1枚のため配置指定は不要です</p>`;
    } else {
      const pk = e.key.slice(0,50);
      const cur = placements[pk] || {};
      let secPrev = "";
      outlineHtml = `<p style="font-size:12px;color:#6b645a;margin:10px 0 6px;">段落を選んで画像を配置してください</p>
        <div style="border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--paper);">`;
      ol.forEach(o => {
        if (o.sec !== secPrev) {
          outlineHtml += `<p style="font-size:11px;color:#6b645a;margin:8px 0 4px;font-weight:600;">## ${esc(o.sec)}</p>`;
          secPrev = o.sec;
        }
        const has2 = cur["2"] === o.n, has3 = cur["3"] === o.n;
        const mark = has2 ? "2" : (has3 ? "3" : "");
        outlineHtml += `<div style="border-left:2px solid ${mark ? "var(--accent)" : "var(--line)"};padding-left:8px;margin-bottom:5px;">
          <p style="font-size:12px;margin:0 0 3px;line-height:1.5;">${esc(o.sum)}</p>
          ${mark
            ? `<span style="font-size:11px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:6px;">画像${mark}を配置 <a href="#" onclick="event.preventDefault();setPlacement('${esc(pk)}','${mark}','')" style="color:#fff;text-decoration:none;">×</a></span>`
            : `<button class="ghost" style="font-size:11px;padding:2px 8px;" onclick="setPlacement('${esc(pk)}','2','${esc(o.n)}')">＋画像2</button>
               ${imgs.length > 2 ? `<button class="ghost" style="font-size:11px;padding:2px 8px;" onclick="setPlacement('${esc(pk)}','3','${esc(o.n)}')">＋画像3</button>` : ""}`}
        </div>`;
      });
      outlineHtml += `</div>`;
      const thumbs = imgs.slice(1,3).map((u,i) => `<div style="text-align:center;">
        <img src="${esc(u)}" style="width:70px;height:70px;object-fit:contain;border:1px solid var(--line);border-radius:6px;background:#fff;">
        <p style="font-size:11px;color:#6b645a;margin:2px 0 0;">画像${i+2}</p></div>`).join("");
      outlineHtml += `<div style="display:flex;gap:10px;margin-top:8px;">${thumbs}</div>`;
    }
  }
  return `<div class="card" style="${border}margin-bottom:10px;">
    <div style="display:flex;gap:12px;align-items:flex-start;">
      ${imgTag}
      <div style="flex:1;min-width:0;">
        <p class="pname" style="margin:0 0 4px;font-size:14px;">${esc(e.key)}</p>
        ${histBadge(e.key)}
        ${e.info ? `<p style="font-size:12px;color:#6b645a;margin:0 0 8px;line-height:1.5;">${esc(e.info.slice(0,110))}</p>` : ""}
        ${btn}
      </div>
    </div>
    ${outlineHtml}
  </div>`;
}

let singleDirty = false;

function setSingle(btn, newStatus) {
  const key = btn.dataset.skey;
  const e = entries.find(x => x.key === key);
  if (!e) return;
  e.status = newStatus;
  singleDirty = true;
  render();
}

async function saveSingleChanges() {
  const bar = document.getElementById("singleSaveBtn");
  if (bar) { bar.textContent = "保存中…"; bar.disabled = true; }
  const text = "# 商品名キー | AmazonリンクURL | 検索語 | 状態 | 画像URL | 商品情報\n"
    + entries.map(x => `${x.key} | ${x.url} | ${x.term || ""} | ${x.status || ""} | ${x.img || ""} | ${x.info || ""}`).join("\n") + "\n";
  const newSha = await ghPut("amazon_links.txt", text, sha, "update: single article selection");
  let ok = !!newSha;
  if (newSha) sha = newSha;
  if (ok) ok = await savePlacements();
  if (ok) {
    singleDirty = false;
    if (bar) { bar.textContent = "✅ 保存しました"; }
    setTimeout(() => render(), 800);
  } else {
    if (bar) { bar.textContent = "❌ 保存に失敗"; bar.disabled = false; }
  }
}

function cleanKey(k) {
  return k.replace(/【[^】]*】/g, " ").replace(/[\[\(][^\]\)]*[\]\)]/g, " ")
          .replace(/送料無料|ポイント[0-9]*倍|あす楽|公式|正規品/g, " ")
          .replace(/\s+/g, " ").trim().slice(0, 40);
}

function card(e, isDone) {
  const ck = e.term || cleanKey(e.key);
  const q = encodeURIComponent(ck);
  const isNone = e.url.toUpperCase() === "NONE";
  const w = warns[e.key.slice(0, 40)] || Object.keys(warns).find(k => e.key.startsWith(k));
  const wmsg = typeof w === "string" && warns[w] ? warns[w] : (warns[e.key.slice(0, 40)] || "");
  return `<div class="card ${isDone ? "done" : "pending"}" ${wmsg ? 'style="border-left-color:#b3261e;"' : ""}>
    <p class="pname">${esc(e.key)}${isNone ? ' <span style="color:#6b645a;font-size:12px;">(Amazon出品なし)</span>' : ""}</p>
    ${wmsg ? `<p style="color:#b3261e;font-size:13px;margin:0 0 8px;">⚠️ ${esc(wmsg)}</p>` : ""}
    <div class="row">
      <input type="url" data-key="${esc(e.key)}" value="${esc(e.url)}" placeholder="商品ページのURLを貼付(短縮URL非推奨)" inputmode="url">
    </div>
    <div class="row" style="margin-top:6px;">
      <a class="amz" href="https://www.amazon.co.jp/s?k=${q}" target="_blank" rel="noopener">Amazonで探す</a>
      <button class="ghost" onclick="copyKey(this)" data-ck="${esc(ck)}">📋 検索語コピー</button>
      <button class="ghost" onclick="markNone(this)" title="記事にAmazonボタンを表示しない">出品なし</button>
      <button class="ghost" style="font-size:12px;padding:4px 8px;" data-hidekey="${esc(e.key)}" onclick="hideLink(this,true)" title="非表示にする">🙈</button>
      ${isDone ? `<button class="ghost" style="font-size:12px;padding:4px 8px;background:var(--accent);color:#fff;border:none;" data-skey="${esc(e.key)}" onclick="setSingle(this,'SINGLE')" title="単品記事の候補にする">📝 単品化</button>` : ""}
    </div>
  </div>`;
}

function copyKey(btn) {
  navigator.clipboard.writeText(btn.dataset.ck).then(() => {
    const t = btn.textContent; btn.textContent = "✅ コピーしました";
    setTimeout(() => { btn.textContent = t; }, 1200);
  });
}

async function hideLink(btn, hide) {
  const key = btn.dataset.hidekey;
  const e = entries.find(x => x.key === key);
  if (!e) return;
  document.querySelectorAll("input[data-key]").forEach(inp => {
    const en = entries.find(x => x.key === inp.dataset.key);
    if (en) en.url = inp.value.trim();
  });
  e.hidden = hide;
  const text = "# 商品名キー | AmazonリンクURL | 検索語 | 状態 | 画像URL | 商品情報\n"
    + entries.map(x => `${x.key} | ${x.url} | ${x.term || ""} | ${x.status || ""} | ${x.img || ""} | ${x.info || ""}`).join("\n") + "\n";
  $("status").textContent = hide ? "非表示にしています…" : "表示に戻しています…";
  const res = await fetch(API, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: `update: ${hide?"hide":"unhide"} link`, content: b64encode(text), sha })
  });
  if (res.ok) { const d = await res.json(); sha = d.content.sha; $("status").textContent = ""; render(); }
  else { $("status").textContent = "保存に失敗しました"; $("status").className = "status err"; }
}

function markNone(btn) {
  const inp = btn.closest(".card").querySelector("input[data-key]");
  inp.value = inp.value.toUpperCase() === "NONE" ? "" : "NONE";
}

async function hideArticle(btn, hide) {
  const title = btn.dataset.hidetitle;
  const a = articles.find(x => x.title === title);
  if (!a) return;
  a.hidden = hide;
  const text = "# タイトル | URL | テーマ | 生成日 | 種別 | 非表示\n"
    + [...articles].reverse().map(x => `${x.title} | ${x.url} | ${x.theme} | ${x.date} | ${x.type} | ${x.hidden ? "HIDDEN" : ""}`).join("\n") + "\n";
  const res = await fetch(TRACKER_API, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: `update: ${hide?"hide":"unhide"} article`, content: b64encode(text), sha: trackerSha })
  });
  if (res.ok) { const d = await res.json(); trackerSha = d.content.sha; renderArticles(); }
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;"); }

async function save() {
  const shortUrls = [];
  document.querySelectorAll("input[data-key]").forEach(inp => {
    const e = entries.find(x => x.key === inp.dataset.key);
    if (e) {
      const v = inp.value.trim();
      if (/amzn\.(to|asia)/i.test(v)) shortUrls.push(e.key.slice(0, 30));
      e.url = v;
    }
  });
  if (shortUrls.length > 0) {
    const ok = confirm(
      "⚠️ 短縮URL(amzn.to / amzn.asia)が含まれています:\n\n" +
      shortUrls.join("\n") +
      "\n\n短縮URLはAmazonアプリで「国を選択」エラーになることがあります。\n" +
      "商品ページのアドレスバーのURL(amazon.co.jp/dp/...)を貼ることを推奨します。\n\nこのまま保存しますか?"
    );
    if (!ok) return;
  }
  const text = "# 商品名キー | AmazonリンクURL | 検索語 | 状態 | 画像URL | 商品情報\n"
    + entries.map(e => `${e.key} | ${e.url} | ${e.term || ""} | ${e.status || ""} | ${e.img || ""} | ${e.info || ""}`).join("\n") + "\n";
  $("status").textContent = "保存中…";
  const res = await fetch(API, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" },
    body: JSON.stringify({ message: "update: amazon links (link-manager)", content: b64encode(text), sha })
  });
  if (res.ok) {
    $("status").textContent = "✅ 保存しました";
    await load();
  } else if (res.status === 409 || res.status === 422) {
    $("status").textContent = "他の更新と衝突しました。再読込して入力し直してください";
    $("status").className = "status err";
  } else {
    $("status").textContent = "保存に失敗しました (HTTP " + res.status + ")";
    $("status").className = "status err";
  }
}

// ===== 記事改善タブ =====
const REQ_PATH = "improve_requests.txt";
const CAND_PATH = "improve_candidates.txt";
const EXTRA_C_PATH = "prompt_extra_compare.txt";
const EXTRA_S_PATH = "prompt_extra_single.txt";
let reqSha = null, reqLines = [], candLines = [], extraC = [], extraS = [], extraCSha = null, extraSSha = null;

async function ghGet(path) {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?t=` + Date.now(), {
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" }, cache: "no-store"
  });
  if (!res.ok) return null;
  const d = await res.json();
  return { sha: d.sha, text: b64decode(d.content) };
}

async function ghPut(path, text, sha, msg) {
  const body = { message: msg, content: b64encode(text) };
  if (sha) body.sha = sha;
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`, {
    method: "PUT",
    headers: { Authorization: "Bearer " + token(), Accept: "application/vnd.github+json" },
    body: JSON.stringify(body)
  });
  if (!res.ok) return null;
  const d = await res.json();
  return d.content.sha;
}

const OUTLINE_PATH = "article_outlines.txt";
const PLACE_PATH = "image_placements.txt";
let outlines = {}, placements = {}, placeSha = null;

const HISTORY_PATH = "single_history.txt";
let history = {};

async function loadHistory() {
  history = {};
  const h = await ghGet(HISTORY_PATH);
  if (!h) return;
  h.text.split("\n").filter(l => l.trim() && !l.startsWith("#")).forEach(l => {
    const p = l.split("|||").map(x => x.trim());
    if (!p[0]) return;
    history[p[0]] = history[p[0]] || { count: 0, last: "" };
    history[p[0]].count++;
    if (p[1] && p[1] > history[p[0]].last) history[p[0]].last = p[1];
  });
}

async function loadOutlines() {
  outlines = {}; placements = {};
  await loadHistory();
  const [ol, pl] = await Promise.all([ghGet(OUTLINE_PATH), ghGet(PLACE_PATH)]);
  if (ol) {
    ol.text.split("\n").filter(l => l.trim() && !l.startsWith("#")).forEach(l => {
      const p = l.split("|||").map(x => x.trim());
      if (p.length < 4) return;
      (outlines[p[0]] = outlines[p[0]] || []).push({ n: p[1], sec: p[2], sum: p[3] });
    });
  }
  placeSha = pl ? pl.sha : null;
  if (pl) {
    pl.text.split("\n").filter(l => l.trim() && !l.startsWith("#")).forEach(l => {
      const p = l.split("|||").map(x => x.trim());
      if (p.length < 3) return;
      (placements[p[0]] = placements[p[0]] || {})[p[1]] = p[2];
    });
  }
}

async function savePlacements() {
  let lines = [];
  Object.keys(placements).forEach(k => {
    Object.keys(placements[k]).forEach(idx => {
      if (placements[k][idx]) lines.push(`${k} ||| ${idx} ||| ${placements[k][idx]}`);
    });
  });
  const text = "# 商品キー ||| 画像番号 ||| 段落番号\n" + lines.join("\n") + "\n";
  const sha = await ghPut(PLACE_PATH, text, placeSha, "update: image placements");
  if (sha) { placeSha = sha; return true; }
  return false;
}

function setPlacement(key, imgIdx, para) {
  placements[key] = placements[key] || {};
  if (para) placements[key][imgIdx] = para;
  else delete placements[key][imgIdx];
  singleDirty = true;
  render();
}

async function loadImprove() {
  const w = $("improveWrap");
  w.innerHTML = '<p class="status">読み込み中…</p>';
  const [req, cand, ec, es] = await Promise.all([
    ghGet(REQ_PATH), ghGet(CAND_PATH), ghGet(EXTRA_C_PATH), ghGet(EXTRA_S_PATH)
  ]);
  reqSha = req ? req.sha : null;
  reqLines = req ? req.text.split("\n").filter(l => l.trim() && !l.startsWith("#")) : [];
  candLines = cand ? cand.text.split("\n").filter(l => l.trim() && !l.startsWith("#")) : [];
  extraCSha = ec ? ec.sha : null;
  extraSSha = es ? es.sha : null;
  extraC = ec ? ec.text.split("\n").filter(l => l.trim() && !l.startsWith("#")) : [];
  extraS = es ? es.text.split("\n").filter(l => l.trim() && !l.startsWith("#")) : [];
  renderImprove();
}

function renderImprove() {
  const w = $("improveWrap");
  const recent = articles.filter(a => !a.hidden).slice(0, 15);
  let html = "";

  // 新規リクエスト
  html += `<p style="font-size:13px;color:#6b645a;padding:8px 0;">改善したい記事を選び、気になる点を書いてください</p>`;
  html += `<div class="card">
    <select id="impTarget" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);margin-bottom:8px;">
      <option value="">-- 記事を選択 --</option>
      ${recent.map(a => `<option value="${esc(a.type)}|${esc(a.title)}">[${esc(a.type)}] ${esc(a.title.slice(0,40))}</option>`).join("")}
    </select>
    <textarea id="impPoints" placeholder="例: 特徴の説明が抽象的で、具体的な数値や仕様が書かれていない" rows="3"
      style="width:100%;padding:9px;border:1px solid var(--line);border-radius:7px;background:var(--paper);font-family:inherit;font-size:14px;"></textarea>
    <button class="save-url" style="margin-top:8px;width:100%;padding:11px;" onclick="submitImprove()">🔧 改善案を作成する</button>
  </div>`;

  // 処理中・レビュー待ち
  const pending = reqLines.filter(l => l.includes("PENDING"));
  const review = reqLines.filter(l => l.includes("REVIEW"));
  const conflict = reqLines.filter(l => l.includes("CONFLICT"));

  if (pending.length > 0) {
    html += `<p style="font-size:13px;color:#6b645a;margin-top:20px;">⏳ 改善案の生成待ち ${pending.length}件(次回の定期実行で処理されます)</p>`;
    pending.forEach(l => {
      const p = l.split("|").map(x => x.trim());
      html += `<div class="card" style="opacity:0.7;"><p class="pname">${esc(p[2])}</p><p class="ameta">${esc(p[3])}</p></div>`;
    });
  }

  if (review.length > 0) {
    html += `<p style="font-size:13px;color:#6b645a;margin-top:20px;">📋 採用する案を選んでください ${review.length}件</p>`;
    review.forEach(l => {
      const p = l.split("|").map(x => x.trim());
      const rid = p[0];
      const cands = candLines.filter(c => c.split("|")[0].trim() === rid);
      html += `<div class="card" style="border-left:4px solid var(--accent);">
        <p class="pname">${esc(p[2])}</p>
        <p class="ameta">指摘: ${esc(p[3])}</p>
        <p style="font-size:12px;color:#6b645a;margin:8px 0;">はてなの下書き「改善案A/B/C」を読み比べてから選んでください</p>`;
      cands.forEach(c => {
        const cp = c.split("|");
        const tag = cp[1].trim();
        const inst = cp.slice(2).join("|").trim();
        html += `<div style="border:1px solid var(--line);border-radius:7px;padding:10px;margin-bottom:8px;">
          <p style="font-weight:600;margin:0 0 4px;">案${esc(tag)}</p>
          <p style="font-size:13px;color:#5f5a52;margin:0 0 8px;line-height:1.6;">${esc(inst)}</p>
          <button class="save-url" style="font-size:12px;padding:6px 12px;" onclick="adoptImprove('${esc(rid)}','${esc(tag)}')">この案を採用</button>
        </div>`;
      });
      html += `<button class="ghost" style="font-size:12px;padding:6px 12px;" onclick="retryImprove('${esc(rid)}')">どれも気に入らない(再生成)</button>
      </div>`;
    });
  }

  if (conflict.length > 0) {
    html += `<p style="font-size:13px;color:#b3261e;margin-top:20px;">⚠️ 矛盾が検出されました ${conflict.length}件 — 下の既存指示を整理してから再度採用してください</p>`;
  }

  // 既存の追加指示
  const showExtra = (title, list, kind) => {
    const len = list.join("").length;
    const over = len > 2000;
    let h = `<details style="margin-top:20px;" ${over ? "open" : ""}>
      <summary style="cursor:pointer;font-weight:600;color:${over ? "#b3261e" : "#6b645a"};">
        ${title} ${list.length}件 / ${len}文字${over ? " ⚠️上限超過" : ""}
      </summary>`;
    h += list.map((l, i) => `<div class="card" style="margin-top:8px;">
      <p style="font-size:13px;margin:0 0 8px;line-height:1.6;">${esc(l.replace(/^-\s*/, ""))}</p>
      <button class="ghost" style="font-size:12px;padding:4px 10px;" onclick="deleteExtra('${kind}',${i})">削除</button>
    </div>`).join("");
    return h + `</details>`;
  };
  html += showExtra("比較記事の追加指示", extraC, "compare");
  html += showExtra("単品記事の追加指示", extraS, "single");

  w.innerHTML = html;
}

async function submitImprove() {
  const sel = $("impTarget").value;
  const points = $("impPoints").value.trim();
  if (!sel || !points) { alert("記事と改善点の両方を入力してください"); return; }
  const [type, title] = sel.split("|");
  const kind = type.includes("単品") ? "single" : "compare";
  const rid = "R" + Date.now().toString().slice(-8);
  const line = `${rid} | ${kind} | ${title} | ${points.replace(/[|\n]/g, " ")} | PENDING`;
  const text = "# ID | 種別 | 対象記事 | 改善点 | 状態\n" + reqLines.concat([line]).join("\n") + "\n";
  const sha = await ghPut(REQ_PATH, text, reqSha, "add: improve request");
  if (sha) { $("impPoints").value = ""; alert("登録しました。次回の定期実行で改善案が作成されます"); loadImprove(); }
  else alert("登録に失敗しました");
}

async function adoptImprove(rid, tag) {
  const text = "# ID | 種別 | 対象記事 | 改善点 | 状態\n"
    + reqLines.map(l => l.split("|")[0].trim() === rid ? l.replace(/\|[^|]*$/, `| ADOPT:${tag}`) : l).join("\n") + "\n";
  const sha = await ghPut(REQ_PATH, text, reqSha, "adopt: " + rid);
  if (sha) { alert("採用しました。次回の定期実行でプロンプトに反映されます"); loadImprove(); }
  else alert("失敗しました");
}

async function retryImprove(rid) {
  const extra = prompt("どの点が気に入らなかったですか?(この内容を加えて再生成します)");
  if (!extra) return;
  const text = "# ID | 種別 | 対象記事 | 改善点 | 状態\n"
    + reqLines.map(l => {
        if (l.split("|")[0].trim() !== rid) return l;
        const p = l.split("|");
        p[3] = ` ${p[3].trim()} / 追加要望: ${extra.replace(/[|\n]/g, " ")} `;
        p[p.length-1] = " PENDING";
        return p.join("|");
      }).join("\n") + "\n";
  const sha = await ghPut(REQ_PATH, text, reqSha, "retry: " + rid);
  if (sha) { alert("再生成をリクエストしました"); loadImprove(); }
}

async function deleteExtra(kind, idx) {
  if (!confirm("この指示を削除しますか?")) return;
  const list = kind === "compare" ? extraC : extraS;
  const path = kind === "compare" ? EXTRA_C_PATH : EXTRA_S_PATH;
  const sha = kind === "compare" ? extraCSha : extraSSha;
  const next = list.filter((_, i) => i !== idx);
  const text = "# 追加改善指示\n" + next.join("\n") + "\n";
  const newSha = await ghPut(path, text, sha, "delete: extra instruction");
  if (newSha) loadImprove();
  else alert("削除に失敗しました");
}

function init() {
  const has = !!token();
  $("setup").hidden = has;
  $("app").hidden = !has;
  if (has) load();
}
init();
</script>
